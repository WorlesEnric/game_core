[package]
name = "r6-e-scratch"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
gamecore-studio = { path = "../../../../../../../studio/agent" }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "process", "fs", "io-util"] }

[profile.dev.package."*"]
debug = false
